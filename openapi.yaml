openapi: 3.1.0
info:
  title: catalog-service
  version: "1.0"
  description: |
    What an organization sells: products, their SKUs, and a list price. One
    record per product, scoped to an organization.

    A list price is what a thing costs before anyone negotiates. Discounts,
    plans and metered usage are billing-service's business; an invoice line
    carries the price it was actually charged at, not a pointer back to here.

    **Every request names an org.** `X-Org-Id` carries it — an id, a slug or a
    short id — and this service asks org-service whether the caller is a member.
    The resolved org id is also the storage tenant, so two organizations'
    catalogs are separated by the store rather than by a column somebody must
    remember to filter on.

    **Who may.** Permissions are org-service's to say: this service registers its
    actions with it (`product.read`, `product.write`, `product.archive`), and asks,
    with the caller's own token, which of them the caller may do in the org.
    Credentials that may only read (a read-only API token, agent or key) are refused
    every write with `403 forbidden` naming the missing permission.

    The API is mounted at `/api`; a gateway publishes it at `/v1/catalog/...`,
    replacing the prefix (workspace ADR 0003). The same routes are still answered at
    the service root and under `/v1` (legacy aliases, to be removed). The wire is
    snake_case; a body that still says `priceCents` is read as `price_cents`.

servers:
  - url: https://example.com/v1/catalog
    description: Behind a gateway (which adds `/api`)
  - url: http://127.0.0.1:3009/api
    description: Direct, for local development

tags:
  - name: discovery
  - name: catalog

security:
  - bearer: []

paths:
  /healthz:
    get:
      tags: [discovery]
      summary: Liveness
      security: []
      description: At the service root, not under `/api`.
      responses:
        "200": { description: ok }

  /.well-known/service:
    get:
      tags: [discovery]
      summary: What this service is
      security: []
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceManifest" }

  /openapi.yaml:
    get:
      tags: [discovery]
      summary: This contract
      security: []
      responses:
        "200": { description: The contract, as YAML }

  /catalog:
    get:
      tags: [catalog]
      summary: List products, or resolve one by SKU
      description: |
        Needs `product.read`.

        `?sku=` looks up the single product carrying that SKU and answers 404
        when there is none. Without it, a page of the catalog.
      parameters:
        - { name: sku, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Products, or a single product when sku was given
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  product: { $ref: "#/components/schemas/Product" }
        "400": { description: org_required — no X-Org-Id }
        "401": { description: No valid token }
        "403": { description: Not a member of this org, or the caller lacks `product.read` }
        "404": { description: No product with that SKU }
        "502": { description: authz_unavailable — org-service could not answer }
    post:
      tags: [catalog]
      summary: Add a product
      description: Needs `product.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: "#/components/schemas/Product" }
        "409": { description: That SKU already belongs to another product (`sku_taken`) }
        "400": { description: Malformed body }
        "403": { description: The caller lacks `product.write` (a read-only credential always does) }

  /catalog/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string }
        description: The id, the short id or the SKU.
    get:
      tags: [catalog]
      summary: One product
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: "#/components/schemas/Product" }
        "404": { description: No such product in this org }
    patch:
      tags: [catalog]
      summary: Change a product
      description: |
        Needs `product.write`. At least one field. Absent fields are left alone.

        Changing a price changes what will be charged next, never what was
        charged before: an invoice line keeps the price it was written with.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: "#/components/schemas/Product" }
        "404": { description: No such product in this org }
    delete:
      tags: [catalog]
      summary: Archive a product
      description: |
        Needs `product.archive`. It stops appearing in the catalog. The record stays — an invoice that
        sold this product must still be explicable.
      responses:
        "204": { description: Archived }
        "404": { description: No such product in this org }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProductInput:
      type: object
      description: |
        `name` is required on create. The 0.2 spelling `priceCents` is still read
        (as `price_cents`) until the last caller has moved.
      properties:
        name: { type: string }
        sku:
          type: string
          description: Your own code for this product. Unique per org.
        description: { type: string }
        category:
          type: string
          description: |
            Free text. ledger-service reads it to pick a revenue account, so a
            realm that keeps books should agree on a vocabulary.
        price_cents:
          type: integer
          description: The list price, in minor units. Money is integer cents everywhere.
        currency: { type: string, minLength: 3, maxLength: 3 }
        labels:
          type: array
          items: { type: string }
        metadata: { type: object, additionalProperties: true }

    Product:
      type: object
      required: [id, short_id, name]
      properties:
        id: { type: string }
        short_id: { type: string }
        name: { type: string }
        sku: { type: [string, "null"] }
        description: { type: [string, "null"] }
        category: { type: [string, "null"] }
        price_cents: { type: [integer, "null"] }
        currency: { type: [string, "null"] }
        labels:
          type: array
          items: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: integer }
        updated_at: { type: integer }

    ServiceManifest:
      type: object
      required: [name, version, api_version]
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: string }
        openapi_url: { type: string }
        capabilities:
          type: array
          items: { type: string }
