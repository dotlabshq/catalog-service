[app]
name  = "catalog-service"
image = "ghcr.io/dotlabshq/catalog-service:0.1.0"

# catalog-service is an org-scoped capability over the shared foldbase. Product
# data is per-org, so the tenant is the org id (set per request via withTenant);
# FOLDBASE_TENANT is not pinned. It calls org-service (the PDP) to verify
# membership on every request.
[env]
# FOLDBASE_SERVICE_URL, FOLDBASE_TOKEN — injected at deploy.
# ORG_SERVICE_URL — injected via service binding (membership checks).
